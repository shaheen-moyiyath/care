services:
  mysql:
    image: mysql:8.0
    container_name: opas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: opas_db
      MYSQL_USER: opas_user
      MYSQL_PASSWORD: opas_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - opas_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opas_backend
    restart: always
    environment:
      PORT: 5000
      JWT_SECRET: opas_super_secret_jwt_key_2026_healthcare
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: opas_user
      DB_PASSWORD: opas_password
      DB_NAME: opas_db
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - opas_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: opas_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - opas_net

volumes:
  mysql_data:

networks:
  opas_net:
    driver: bridge
